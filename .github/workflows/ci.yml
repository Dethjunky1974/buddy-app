name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check server/index.js
      - run: node --check public/app.js
      - run: zsh -n install.sh scripts/install-macos.sh
      - run: python3 -m py_compile scripts/pin-dock.py
